<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>のぼれ！タイピングアスレチック</title>
<meta name="description" content="表示されたことばを入力すると、アスレチックを上へのぼっていくタイピング練習アプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap">
<style>
/* Layout: one-screen app. Sky-and-wood athletic tower on top, word card + input pinned under it (stays above the phone keyboard). */
:root {
  color-scheme: light;
  --sky-lo: #cdeeff;
  --sky-mid: #8fcdf7;
  --sky-hi: #3c6fd1;
  --sky-top: #1f3577;
  --wood: #b5702f;
  --wood-dk: #6f3f17;
  --rope: #e9cf93;
  --leaf: #3d9f4b;
  --leaf-dk: #2a7436;
  --sun: #ffc83a;
  --ink: #22304a;
  --ink-soft: #5a6a86;
  --paper: #fffbf2;
  --card: #ffffff;
  --line: #e6dccb;
  --berry: #ff5a6e;
  --ok: #16a05f;
  --ng: #e0453a;
  --font-display: "Mochiy Pop One", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-text-size-adjust: 100%; }
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }

#app { position: fixed; left: 0; right: 0; top: 0; height: var(--vh, 100%); display: flex; flex-direction: column; background: var(--paper); }

/* ---------- header ---------- */
.bar { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; background: var(--paper); border-bottom: 2px solid var(--line); font-weight: 800; }
.bar .course { font-size: .8rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { font-size: 1rem; }
.icon-btn { border: 2px solid var(--line); background: var(--card); border-radius: 10px; width: 36px; height: 34px; font-size: .95rem; font-weight: 800; display: grid; place-items: center; padding: 0; }

/* ---------- scene ---------- */
#scene { position: relative; flex: 1; min-height: 110px; overflow: hidden; background: var(--sky-lo); }
#world { position: absolute; left: 0; right: 0; bottom: 0; transition: transform .7s cubic-bezier(.3,.7,.3,1);
  background: linear-gradient(to top, var(--sky-lo) 0%, var(--sky-mid) 35%, var(--sky-hi) 78%, var(--sky-top) 100%); }
.stars { position: absolute; left: 0; right: 0; top: 0; height: 260px; opacity: .8;
  background-image: radial-gradient(2px 2px at 12% 30%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 78% 18%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 40% 55%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 88% 62%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 25% 75%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 62% 40%, #fff 50%, transparent 51%); }
.sun { position: absolute; right: 8%; width: 70px; height: 70px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 10px rgba(255,200,58,.25), 0 0 0 22px rgba(255,200,58,.12); }
.cloud { position: absolute; width: 90px; height: 28px; background: #fff; border-radius: 20px; opacity: .92; animation: drift linear infinite alternate; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 40px; height: 40px; left: 14px; top: -20px; }
.cloud::after { width: 30px; height: 30px; left: 44px; top: -13px; }
@keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }

.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: var(--leaf);
  box-shadow: inset 0 8px 0 #57b964; }
.ground::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 14px;
  background: radial-gradient(circle at 10px 14px, #57b964 10px, transparent 11px) 0 0 / 22px 14px repeat-x; }
.tree { position: absolute; bottom: 60px; width: 46px; height: 70px; }
.tree::before { content: ""; position: absolute; left: 19px; bottom: 0; width: 8px; height: 26px; background: var(--wood-dk); border-radius: 3px; }
.tree::after { content: ""; position: absolute; left: 0; bottom: 20px; width: 46px; height: 50px; border-radius: 50% 50% 46% 46%; background: var(--leaf-dk); }

.plat { position: absolute; width: 36%; height: 16px; border-radius: 6px;
  background: repeating-linear-gradient(90deg, var(--wood) 0 22px, #a5642a 22px 24px); box-shadow: 0 5px 0 var(--wood-dk); }
.plat .post { position: absolute; bottom: -40px; width: 8px; height: 40px; background: var(--wood-dk); border-radius: 0 0 3px 3px; }
.plat .post.l { left: 10%; } .plat .post.r { right: 10%; }
.sign { position: absolute; top: -26px; padding: 1px 7px; border-radius: 5px; background: var(--paper); border: 2px solid var(--wood-dk); font-size: .72rem; font-weight: 800; color: var(--wood-dk); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plat.left .sign { left: 6px; } .plat.right .sign { right: 6px; }
.plat.start { background: repeating-linear-gradient(90deg, #c98a45 0 22px, #b8783a 22px 24px); }

.con { position: absolute; transform: translateX(-50%); }
.con.ladder { width: 34px; border-left: 6px solid var(--wood-dk); border-right: 6px solid var(--wood-dk);
  background: repeating-linear-gradient(to top, transparent 0 14px, var(--wood) 14px 20px); }
.con.rope { width: 10px; border-radius: 5px;
  background: repeating-linear-gradient(160deg, var(--rope) 0 6px, #c9a964 6px 9px); }
.con.rope::after { content: ""; position: absolute; left: -5px; right: -5px; height: 10px; border-radius: 50%; background: #c9a964; top: 40%; box-shadow: 0 26px 0 #c9a964, 0 -26px 0 #c9a964; }
.con.net { width: 70px; border: 4px solid var(--rope); border-radius: 4px;
  background: repeating-linear-gradient(45deg, transparent 0 9px, var(--rope) 9px 12px), repeating-linear-gradient(-45deg, transparent 0 9px, var(--rope) 9px 12px); }
.con.wall { width: 64px; border-radius: 6px; background-color: #f2e3c4; border: 3px solid var(--wood-dk);
  background-image: radial-gradient(circle at 20% 15%, var(--berry) 5px, transparent 6px), radial-gradient(circle at 70% 32%, var(--sun) 5px, transparent 6px), radial-gradient(circle at 30% 52%, #2d9cdb 5px, transparent 6px), radial-gradient(circle at 75% 70%, var(--leaf) 5px, transparent 6px), radial-gradient(circle at 35% 88%, #9b59d0 5px, transparent 6px); }
.con.pole { width: 12px; border-radius: 6px; background: linear-gradient(90deg, #9aa4b5, #e8edf5 45%, #8a93a3); }
.con-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: .62rem; font-weight: 800; color: var(--wood-dk); background: rgba(255,251,242,.92); padding: 0 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
.con.ladder .con-label, .con.rope .con-label, .con.pole .con-label { left: calc(50% + 34px); }

.goal-flag { position: absolute; bottom: 16px; width: 6px; height: 70px; background: #555; border-radius: 3px; }
.goal-flag::after { content: ""; position: absolute; left: 6px; top: 2px; width: 44px; height: 30px; background: var(--berry);
  clip-path: polygon(0 0, 100% 50%, 0 100%); transform-origin: left center; animation: wave 1.2s ease-in-out infinite alternate; }
@keyframes wave { to { transform: scaleX(.8) skewY(4deg); } }
.goal-banner { position: absolute; font-family: var(--font-display); color: #fff; font-size: 1.3rem; text-shadow: 0 3px 0 var(--sky-top); white-space: nowrap; transform: translateX(-50%); }

.climber { position: absolute; width: 50px; height: 60px; margin-left: -25px; z-index: 5;
  transition: left .28s linear, bottom .55s cubic-bezier(.4,.1,.4,1); }
.climber svg { width: 100%; height: 100%; display: block; overflow: visible; transition: transform .2s; }
.climber.flip svg { transform: scaleX(-1); }
.climber .limb { transform-box: fill-box; transform-origin: 50% 8%; }
.climber .armL { transform: rotate(20deg); } .climber .armR { transform: rotate(-20deg); }
.climber.walk .legL { animation: stepA .28s ease-in-out infinite alternate; }
.climber.walk .legR { animation: stepB .28s ease-in-out infinite alternate; }
.climber.climb .armL { animation: reachA .26s ease-in-out infinite alternate; }
.climber.climb .armR { animation: reachB .26s ease-in-out infinite alternate; }
.climber.climb .legL { animation: stepA .26s ease-in-out infinite alternate; }
.climber.climb .legR { animation: stepB .26s ease-in-out infinite alternate; }
.climber.cheer .armL { transform: rotate(150deg); } .climber.cheer .armR { transform: rotate(-150deg); }
.climber.cheer svg { animation: hop .45s ease-in-out infinite alternate; }
@keyframes stepA { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
@keyframes stepB { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
@keyframes reachA { from { transform: rotate(170deg); } to { transform: rotate(120deg); } }
@keyframes reachB { from { transform: rotate(-120deg); } to { transform: rotate(-170deg); } }
@keyframes hop { to { transform: translateY(-14px); } }

.bubble { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 2px 9px; font-weight: 800; font-size: .85rem; white-space: nowrap; animation: pop .9s ease-out forwards; pointer-events: none; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -16px); } }

#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }

/* ---------- word panel ---------- */
.panel { padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--paper); border-top: 3px solid var(--wood-dk); display: grid; gap: 8px; }
.word-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 14px; min-height: 64px; }
.word-card.shake { animation: shake .35s; border-color: var(--ng); }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.pic { font-size: 2.2rem; line-height: 1; flex: none; }
.word-text { min-width: 0; flex: 1; }
.word { font-family: var(--font-display); font-size: clamp(1.5rem, 7.5vw, 2.2rem); line-height: 1.25; letter-spacing: .04em; word-break: break-all; }
.word span { color: var(--ink); transition: color .12s; }
.word span.done { color: var(--ok); }
.word span.next { text-decoration: underline 3px var(--sun); text-underline-offset: 6px; }
.romaji { font-size: .85rem; color: var(--ink-soft); letter-spacing: .08em; font-weight: 800; min-height: 1.1em; }
.romaji[hidden] { display: none !important; }
/* rhythm mode: one dot per beat the word may use; dots fill as beats go by */
.beats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.beats i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.beats i.past { background: var(--sun); }
.beats i.half { box-shadow: 0 0 0 2px var(--ok); }
.word-card.beat { animation: thump .18s ease-out; }
@keyframes thump { 0% { transform: scale(1.025); border-color: var(--sun); } 100% { transform: scale(1); } }
.opt select { margin-left: auto; flex: none; font: inherit; font-size: .9rem; padding: 4px 6px; border-radius: 8px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }

form.type-row { display: flex; gap: 8px; margin: 0; }
/* The box the child sees is drawn by the app; the real input sits on top of it, invisible.
   Leftover text a phone keyboard writes back into the real input never shows up here. */
.type-wrap { position: relative; flex: 1; min-width: 0; }
.type-box { font-weight: 800; font-size: 1.25rem; line-height: 1.4; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap; overflow: hidden; display: flex; align-items: center; min-height: 54px; }
.type-box.empty::before { content: "ここに入力してね"; color: var(--ink-soft); font-weight: 500; }
.type-wrap:focus-within .type-box { border-color: var(--sky-hi); }
.type-wrap:focus-within .type-box::after { content: ""; width: 2px; height: 1.3em; margin-left: 2px; background: var(--sky-hi); animation: blink 1s steps(1) infinite; }
.type-wrap:focus-within .type-box.empty::after { order: -1; margin: 0 4px 0 0; }
.type-box.bad { border-color: var(--ng) !important; background: #fff4f2; }
@keyframes blink { 50% { opacity: 0; } }
#typeInput, #imeSink { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0 14px; background: transparent; color: transparent; caret-color: transparent; }
#imeSink { pointer-events: none; }
.pass-btn { flex: none; border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 0 14px; font-weight: 800; font-size: .95rem; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: linear-gradient(to bottom, var(--sky-mid), var(--sky-lo) 55%, var(--paper) 100%); }
.sheet { width: 100%; max-width: 440px; display: grid; gap: 14px; margin-block: auto; }
.title { font-family: var(--font-display); font-size: clamp(1.8rem, 9vw, 2.5rem); line-height: 1.2; text-align: center; margin: 0; color: var(--ink); text-wrap: balance; }
.title small { display: block; font-size: .45em; color: var(--wood-dk); letter-spacing: .1em; margin-bottom: 4px; }
.lead { text-align: center; margin: 0; font-size: .95rem; line-height: 1.7; color: var(--ink); }
.hero-climber { width: 72px; height: 86px; margin: 0 auto; }
.hero-climber svg { width: 100%; height: 100%; }
.hero-climber .armL { transform: rotate(150deg); } .hero-climber .armR { transform: rotate(-150deg); }
.hero-climber .limb { transform-box: fill-box; transform-origin: 50% 8%; }
.courses { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.course-btn { text-align: left; border: 3px solid var(--wood-dk); border-radius: 16px; background: var(--card); padding: 12px; display: grid; gap: 2px; box-shadow: 0 4px 0 var(--wood-dk); transition: transform .08s, box-shadow .08s; }
.course-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dk); }
.course-btn .lv { font-size: .72rem; font-weight: 800; color: #fff; background: var(--c, var(--leaf)); border-radius: 999px; padding: 1px 8px; justify-self: start; }
.course-btn .nm { font-family: var(--font-display); font-size: 1.05rem; }
.course-btn .ex { font-size: .75rem; color: var(--ink-soft); }
.course-btn .best { font-size: .75rem; font-weight: 800; color: var(--wood-dk); font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; background: rgba(255,255,255,.7); border-radius: 14px; padding: 10px 14px; }
.opt { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: .92rem; }
.opt input { width: 22px; height: 22px; accent-color: var(--leaf); }
.opt .sub { font-weight: 500; font-size: .78rem; color: var(--ink-soft); }
.result-big { font-family: var(--font-display); font-size: 2.6rem; text-align: center; margin: 0; color: var(--berry); text-shadow: 0 3px 0 #fff; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px; text-align: center; }
.stat .k { font-size: .72rem; color: var(--ink-soft); font-weight: 800; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.newrec { justify-self: center; background: var(--sun); color: var(--ink); font-weight: 800; padding: 4px 14px; border-radius: 999px; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big-btn { border: 3px solid var(--wood-dk); border-radius: 16px; background: var(--sun); font-weight: 800; font-size: 1.05rem; padding: 14px 8px; box-shadow: 0 4px 0 var(--wood-dk); }
.big-btn.alt { background: var(--card); }
.big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dk); }

@media (prefers-reduced-motion: reduce) {
  #world, .climber { transition-duration: .01s !important; }
  .cloud, .goal-flag::after, .newrec, .climber.cheer svg, .word-card.beat { animation: none !important; }
}
</style>

<div id="app">
  <div class="bar">
    <button class="icon-btn" id="quitBtn" type="button" aria-label="コースえらびにもどる">✕</button>

  <div id="scene">
    <div id="world"></div>
    <canvas id="confetti"></canvas>

  <div class="panel">

        <div class="type-box empty" id="typeBox" aria-hidden="true"></div>

  <div class="overlay" id="startScreen">

      <p class="lead">出てきたことばを入力すると、1だんのぼれるよ。<br>10だんのぼって、てっぺんの旗をめざそう！</p>
      <div class="courses" id="courses"></div>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="optRomaji"> <span>ローマ字のヒントを出す<br><span class="sub">キーボードでローマ字入力するときに</span></span></label>
        <label class="opt"><span>リズムモード<br><span class="sub">はくに合わせて入力しよう</span></span>
          <select id="optRhythm">
            <option value="0">なし</option>
            <option value="70">ゆっくり</option>
            <option value="90">ふつう</option>
            <option value="110">はやい</option>
          </select></label>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultScreen" hidden>
    <div class="sheet">
      <div class="hero-climber" id="heroClimber2"></div>
      <p class="result-big">ゴール！</p>
      <p class="lead" id="resultLead">30mのてっぺんまでのぼったよ！</p>
      <div class="newrec" id="newRec" hidden>しんきろく！</div>
      <div class="stats">
        <div class="stat"><div class="k" id="rK1">タイム</div><div class="v" id="rTime">0.0</div></div>
        <div class="stat"><div class="k" id="rK2">ミス</div><div class="v" id="rMiss">0</div></div>
        <div class="stat"><div class="k" id="rK3">パス</div><div class="v" id="rPass">0</div></div>
      </div>
      <div class="lead" id="rBest"></div>
      <div class="btn-row">
        <button class="big-btn" id="againBtn" type="button">もういちど</button>
        <button class="big-btn alt" id="menuBtn" type="button">コースをえらぶ</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

// ---------------- word lists ----------------

const Y = { き: ["ky"], ぎ: ["gy"], に: ["ny"], ひ: ["hy"], び: ["by"], ぴ: ["py"], み: ["my"], り: ["ry"], し: ["sh", "sy"], ち: ["ch", "ty", "cy"], じ: ["j", "zy", "jy"], ぢ: ["dy"] };

const N_BLOCK = "あいうえおやゆよなにぬねのんぁぃぅぇぉゃゅょ";

function normalize(s) {
  return s.normalize("NFKC").toLowerCase().replace(/\s+/g, "")
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

function makeMatcher(target, abc) {
  const optCache = [];
  function options(k) {
    if (optCache[k]) return optCache[k];
    const c = target[k], c2 = target.slice(k, k + 2), opts = [[c, 1]];
    if (!abc) {
      if (c2.length === 2 && T[c2]) T[c2].forEach(a => opts.push([a, 2]));
      if (T[c]) T[c].forEach(a => opts.push([a, 1]));
      if (c === "ん") {
        opts.push(["nn", 1], ["n'", 1], ["xn", 1]);
        const nx = target[k + 1];
        if (!nx || !N_BLOCK.includes(nx)) opts.push(["n", 1]);
      }
      if (c === "っ" && k + 1 < target.length) {
        for (const [a, n] of options(k + 1)) if (/^[bcdfghjkmpqrstvwyz]/.test(a)) opts.push([a[0] + a, 1 + n]);
      }
    }
    return (optCache[k] = opts);
  }
  // returns how many target chars are finished, or -1 if the input can't lead to the target
  return function progress(input) {
    const memo = new Map();
    function f(k, p) {
      if (p === input.length) return k;
      if (k >= target.length) return -1;
      const key = k * 1000 + p;
      if (memo.has(key)) return memo.get(key);
      let best = -1;
      const rest = input.slice(p);
      for (const [a, n] of options(k)) {
        if (rest.startsWith(a)) best = Math.max(best, f(k + n, p + a.length));
        else if (a.startsWith(rest)) best = Math.max(best, k);
      }
      memo.set(key, best);
      return best;
    }
    return f(0, 0);
  };
}

function romajiHint(t) {
  function first(k) {
    const c = t[k], c2 = t.slice(k, k + 2);
    if (c === "っ" && k + 1 < t.length) { const [a, n] = first(k + 1); return [/^[a-z]/.test(a) ? a[0] + a : "xtu" + a, 1 + n]; }
    if (c === "ん") { const nx = t[k + 1]; return [!nx || !N_BLOCK.includes(nx) ? "n" : "nn", 1]; }
    if (c2.length === 2 && T[c2]) return [T[c2][0], 2];
    if (T[c]) return [T[c][0], 1];
    return [c, 1];
  }
  let out = "", k = 0;
  while (k < t.length) { const [a, n] = first(k); out += a; k += n; }
  return out;
}

function beep(notes, type = "triangle", len = 0.12, vol = 0.18) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime;
    for (const f of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len);
      t += len * 0.75;
    }
  } catch {}
}

function placeClimber(i, instant) {
  if (instant) { climber.style.transition = "none"; }
  climber.style.left = platX(i) + "%";
  climber.style.bottom = platY(i) + 16 + "px";

}
function camera(y, instant) {
  const h = scene.clientHeight;
  const off = Math.max(0, Math.min(WORLD_H - h, y - h * 0.3));
  if (instant) world.style.transition = "none";
  world.style.transform = `translateY(${off}px)`;
  if (instant) { void world.offsetWidth; world.style.transition = ""; }
}
let camY = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// climbs are queued so fast typists never skip an animation
let climbChain = Promise.resolve(), shownLevel = 0;
function climbTo(target) {
  climbChain = climbChain.then(async () => {
    while (shownLevel < target) {
      const from = shownLevel, to = from + 1;
      const fast = reduced ? 0 : 1;
      climber.classList.toggle("flip", platX(from) > 50);
      climber.classList.add("walk");
      climber.style.left = "50%";
      await wait(280 * fast);
      climber.classList.remove("walk"); climber.classList.add("climb");
      climber.style.bottom = platY(to) + 16 + "px";
      camY = platY(to); camera(camY);
      await wait(560 * fast);
      climber.classList.remove("climb"); climber.classList.add("walk");
      climber.classList.toggle("flip", platX(to) < 50);
      climber.style.left = platX(to) + "%";
      await wait(280 * fast);
      climber.classList.remove("walk");
      shownLevel = to;
      $("height").textContent = to * METER;
    }
  });
  return climbChain;
}

function bubble(text) {

function fmt(ms) { return (ms / 1000).toFixed(1); }

function nextWord() {
  if (!queue.length) queue = shuffle(course.list.slice());
  // never start with the same letter as the last word, so leftover text can't be mistaken for new typing
  const prev = cur && cur.target ? cur.target[0] : "";
  const i = queue.findLastIndex(w => normalize(w.word)[0] !== prev);
  cur = queue.splice(i < 0 ? queue.length - 1 : i, 1)[0];
  cur.target = normalize(cur.word);
  matcher = makeMatcher(cur.target, course.abc);
  $("pic").textContent = cur.pic;
  $("romaji").textContent = course.abc ? "" : romajiHint(cur.target);
  $("romaji").hidden = course.abc || !showRomaji;
  renderWord(0);
  if (beat) { cur.window = beatWindow(cur.target); cur.beats = 0; renderBeats(); }
  // redraw the box with the new word's matcher: with the old one, the finished word still reads as valid and stays on screen
  renderBox(false);
}
function renderWord(done) {
  const chars = Array.from(cur.word);
  $("word").innerHTML = chars.map((c, i) => `<span class="${i < done ? "done" : i === done ? "next" : ""}">${c}</span>`).join("");
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startGame(key) {
  course = COURSES[key];
  course.key = key;

// ---------------- rhythm mode ----------------
// A steady beat plays. Each word may use a number of beats (about two per kana);
// finishing in the first half is "perfect", later is "good", running out is a miss.
let beat = null, perfects = 0, goods = 0;
function beatWindow(t) { return course.abc ? Math.max(4, t.length + 2) : Math.max(4, t.length * 2); }
function startBeat() {
  let next = performance.now() + beat.ms;
  const run = () => {
    if (!beat) return;
    onBeat();
    next += beat.ms;
    beat.timer = setTimeout(run, Math.max(0, next - performance.now()));
  };
  beat.timer = setTimeout(run, beat.ms);
}
function stopBeat() { if (beat) clearTimeout(beat.timer); beat = null; }
function onBeat() {
  if (!playing) return;
  cur.beats++;
  beep([cur.beats === 1 ? 1320 : 990], "square", 0.04, 0.05);
  const card = $("wordCard");
  card.classList.remove("beat"); void card.offsetWidth; card.classList.add("beat");
  if (cur.beats > cur.window) return timeUp();
  renderBeats();
}
function renderBeats() {
  const half = Math.ceil(cur.window / 2);
  $("beats").innerHTML = Array.from({ length: cur.window }, (_, i) =>
    `<i class="${i < cur.beats ? "past" : ""}${i === half - 1 ? " half" : ""}"></i>`).join("");
}
function timeUp() {
  misses++;

// Phone keyboards keep the text they are still converting and may write it back
// after value = "", at unpredictable times and in a changed form (iPhone romaji:
// "みかn" comes back as "みかんk"). So earlier words are recognised by whether
// they read as that word, not by exact text, and skipped. This only kicks in
// when the box does not already read as the start of the current word.
let earlier = [], composing = false, resetting = false;
function rememberWord() {
  if (!cur || !cur.target || !matcher) return;
  earlier.push({ m: matcher, len: cur.target.length });
  if (earlier.length > STEPS) earlier.shift();
}
function currentText() {
  let rest = input.value;
  if (!rest || !earlier.length || matcher(normalize(rest)) >= 0) return rest;
  for (let changed = true; changed && rest;) {
    changed = false;
    for (const w of earlier) {
      for (let i = rest.length; i > 0; i--) {
        if (w.m(normalize(rest.slice(0, i))) === w.len) { rest = rest.slice(i); changed = true; break; }
      }
      if (changed) break;
    }
    if (rest && matcher(normalize(rest)) >= 0) return rest;
  }
  // only part of an earlier word is left (the keyboard is still holding it)
  if (rest && earlier.some(w => w.m(normalize(rest)) >= 0)) return "";
  return rest;
}
// once the keyboard has finished converting, the real value can be cleaned too
function tidy() {
  if (composing) return;
  const rest = currentText();
  if (rest !== input.value) input.value = rest;
}
function readInput() {
  return normalize(currentText());
}
function renderBox(bad) {
  const t = currentText();
  typeBox.textContent = t;
  typeBox.classList.toggle("empty", !t);
  typeBox.classList.toggle("bad", !!bad);
  typeBox.scrollLeft = typeBox.scrollWidth;
}

function check() {
  if (!playing || resetting) return;
  const v = readInput();
  const p = v ? matcher(v) : 0;
  if (p === cur.target.length) return hit();
  renderBox(p < 0);
  renderWord(Math.max(0, p));
}

// Clearing value alone leaves the keyboard's unfinished text (IME composition)
// alive, and the keyboard writes it back. Moving focus away ends the composition;
// moving it to another text box (not just blur) keeps the phone keyboard open.
function clearInput() {
  rememberWord();
  const hadFocus = document.activeElement === input;
  resetting = true;
  try {
    if (hadFocus && composing) {
      imeSink.inputMode = input.inputMode;
      imeSink.focus({ preventScroll: true });
    }
    input.value = "";
    composing = false;
    if (hadFocus && document.activeElement !== input) input.focus({ preventScroll: true });
    imeSink.value = "";
  } finally {
    resetting = false;
  }
}

function hit() {
  clearInput();
  level++;
  sfx.ok();
  const now = performance.now();
  climbTo(level).then(() => {});
  let say = now - lastHit < 3500 && lastHit ? "はやい！" : PRAISE[Math.floor(Math.random() * PRAISE.length)];
  if (beat) {
    const perfect = cur.beats <= Math.ceil(cur.window / 2);
    if (perfect) perfects++; else goods++;
    say = perfect ? "パーフェクト！" : "グッド！";
  }
  setTimeout(() => bubble(say), reduced ? 0 : 900);
  lastHit = now;
  if (level >= STEPS) return finish();
  nextWord();
}

function finish() {
  playing = false;
  const rhythm = !!beat;
  stopBeat();
  endAt = performance.now();
  clearInterval(tick);
  const ms = endAt - startAt;
  $("timer").textContent = fmt(ms);
  input.disabled = true;
  input.blur();
  climbChain.then(async () => {
    climber.classList.add("cheer");
    sfx.goal();
    confetti();
    await wait(1500);
    $("resultLead").textContent = `${STEPS * METER}mのてっぺんまでのぼったよ！`;
    if (rhythm) {
      // the beat sets the pace, so rhythm runs are not compared with the best time
      [["パーフェクト", perfects], ["グッド", goods], ["ミス", misses + passes]].forEach(([k, v], i) => {
        $("rK" + (i + 1)).textContent = k;
        $(["rTime", "rMiss", "rPass"][i]).textContent = v;
      });
      $("newRec").hidden = true;
      $("rBest").textContent = misses + passes === 0 ? "ぜんぶリズムに間に合ったよ！" : "";
    } else {
      const prev = best[course.key];
      const isNew = prev == null || ms < prev;
      if (isNew) { best[course.key] = ms; store.set("climb-best", best); }
      ["タイム", "ミス", "パス"].forEach((k, i) => { $("rK" + (i + 1)).textContent = k; });
      $("rTime").textContent = fmt(ms);
      $("rMiss").textContent = misses;
      $("rPass").textContent = passes;
      $("newRec").hidden = !isNew;
      $("rBest").textContent = isNew && prev != null ? `まえのきろく ${fmt(prev)}びょう` : !isNew ? `じこベスト ${fmt(best[course.key])}びょう` : "";
    }
    $("resultScreen").hidden = false;
    renderCourses();
  });
}

function goMenu() {
  playing = false; clearInterval(tick); stopBeat();
  input.blur();
  renderCourses();
  $("resultScreen").hidden = true;
  $("startScreen").hidden = false;
}

function renderCourses() {
  $("courses").innerHTML = Object.entries(COURSES).map(([k, c]) => `
    <button class="course-btn" type="button" data-course="${k}" style="--c:${c.color}">
      <span class="lv">${c.lv}</span><span class="nm">${c.name}</span><span class="ex">${c.ex}</span>
      <span class="best">${best[k] != null ? `ベスト ${fmt(best[k])}びょう` : "まだきろくなし"}</span>
    </button>`).join("");
}

// ---------------- confetti ----------------
function confetti() {
  if (reduced) return;
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const w = cv.width = scene.clientWidth, h = cv.height = scene.clientHeight;
  const colors = ["#ff5a6e", "#ffc83a", "#3d9f4b", "#2d8bd6", "#8a4fc8", "#ffffff"];
  const ps = Array.from({ length: 90 }, () => ({ x: w / 2, y: h * 0.45, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 6.28, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of ps) { p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); }
    if (t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
  })(t0);
}

// ---------------- events ----------------
// listen on the form: the input element gets replaced after every word
input.addEventListener("compositionstart", () => { composing = true; });
input.addEventListener("compositionend", () => {
  composing = false;
  check();
  setTimeout(() => { tidy(); check(); }, 0);
});
input.addEventListener("input", e => {
  if (!e.isComposing) tidy();
  check();
});
input.addEventListener("blur", () => { composing = false; });
$("typeForm").addEventListener("submit", e => {
  e.preventDefault();
  if (!playing) return;
  const v = readInput();
  if (!v) return;
  if (matcher(v) === cur.target.length) return hit();
  misses++;
  sfx.miss();
  const card = $("wordCard");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
});
$("passBtn").addEventListener("click", () => {
  if (!playing) return;
  passes++;
  clearInput();
  nextWord();
  input.focus();
});
$("courses").addEventListener("click", e => {
  const b = e.target.closest("[data-course]");
  if (b) startGame(b.dataset.course);
});
$("againBtn").addEventListener("click", () => startGame(course.key));
$("menuBtn").addEventListener("click", goMenu);
$("quitBtn").addEventListener("click", goMenu);
$("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn; store.set("climb-sound", soundOn);
  $("soundBtn").style.opacity = soundOn ? 1 : 0.4;
  if (soundOn) sfx.ok();
});
$("soundBtn").style.opacity = soundOn ? 1 : 0.4;
const optR = $("optRomaji");
optR.checked = showRomaji;
optR.addEventListener("change", () => { showRomaji = optR.checked; store.set("climb-romaji", showRomaji); });
const optB = $("optRhythm");
optB.value = String(rhythmBpm);
optB.addEventListener("change", () => { rhythmBpm = +optB.value; store.set("climb-rhythm", rhythmBpm); });
scene.addEventListener("click", () => { if (playing) input.focus(); });

// keep the app inside the visible area when the phone keyboard opens
function fit() {
  const vv = window.visualViewport;
  app.style.setProperty("--vh", (vv ? vv.height : window.innerHeight) + "px");
  app.style.top = (vv ? vv.offsetTop : 0) + "px";
  camera(platY(shownLevel), true);
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit); }
window.addEventListener("resize", fit);

// ---------------- boot ----------------
buildWorld();
renderCourses();
course = COURSES.easy; course.key = "easy";
cur = { pic: "🐶", word: "いぬ" };
fit();
placeClimber(0, true);
})();
</script>
